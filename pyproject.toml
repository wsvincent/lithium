[project]
name = "lithium"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django ~=6.1.2",
  "django-allauth[openid,socialaccount] ~=65.21",
  "django-debug-toolbar ~=8.0",
  "django-crispy-forms ~=2.7",
  "crispy-bootstrap5 ~=2026.9",
  "gunicorn ~=25.3",
  "psycopg[binary] ~=3.3",
  "whitenoise ~=6.12",
]

[dependency-groups]
dev = [
  "typing_extensions ~=4.12",
]
